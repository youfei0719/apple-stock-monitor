# stock.glint.red — Apple 库存监控 SaaS
# 放到 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name stock.glint.red;
    # HTTPS：443 块自带 SSL stanza；证书由 deploy.sh 以 `certbot certonly` 申请
    # （不改写本 conf），首次部署人工盯一次 certbot 输出
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stock.glint.red;

    # ssl 证书：deploy.sh 以 certonly 申请（--standalone），路径如下；禁止 certbot --nginx 改写本文件
    ssl_certificate /etc/letsencrypt/live/stock.glint.red/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock.glint.red/privkey.pem;

    # --- 安全头（最高等级） ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    # --- 前台静态 ---
    root /opt/stockmon/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 后台独立入口 ---
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /opt/stockmon/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- API 反代 ---
    location = /api {
        return 301 /api/;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # R26-D-1：后端 healthz 挂在根路径 /healthz，公网地址是 /api/healthz；
    # 精确匹配把 /api/healthz 转写到后端 /healthz（生产部署实测 404 后补）。
    location = /api/healthz {
        proxy_pass http://127.0.0.1:8101/healthz;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8101;
    }

    access_log /opt/stockmon/logs/nginx.access.log;
    error_log /opt/stockmon/logs/nginx.error.log;
}
