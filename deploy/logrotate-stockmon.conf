# StockMon 日志轮转：/opt/stockmon/logs/*.log
# 由 deploy.sh 安装到 /etc/logrotate.d/stockmon
# 用 copytruncate：systemd 以 StandardOutput=append 直接写文件，无 reopen 信号可用
/opt/stockmon/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    dateext
    missingok
    notifempty
    copytruncate
    su root root
}
